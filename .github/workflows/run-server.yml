name: ISHU X999 24-7 Cloud Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start ISHU Glory Server & Public Tunnel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting main.py backend on port 8080..."
          python -u main.py > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to bind port
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Local server is up and responsive!"
              break
            fi
            sleep 1
          done

          echo "Starting Cloudflare tunnel..."
          cloudflared tunnel --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # Extract live tunnel URL
          TUNNEL_URL=""
          for i in {1..35}; do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "=================================================="
          echo "🔥 ISHU X999 GLORY SERVER IS ONLINE 24/7!"
          echo "🌐 PUBLIC WEBSITE URL: $TUNNEL_URL"
          echo "👤 LOGIN: 999X"
          echo "🔑 PASSWORD: ISHU"
          echo "=================================================="

          # Write to Step Summary
          echo "## 🚀 ISHU X999 Cloud Glory Server is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Website URL: **[$TUNNEL_URL]($TUNNEL_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "- **Username:** \`999X\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`ISHU\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme:** Premium Crimson Red • ISHU X999 Official" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Active 24/7 with auto-relaunch" >> $GITHUB_STEP_SUMMARY

          # Update Repo description & website URL via GitHub API
          if [ -n "$TUNNEL_URL" ]; then
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }} \
              -d "{\"description\":\"🔥 ISHU X999 Guild Glory Cloud Server | Live: $TUNNEL_URL\",\"homepage\":\"$TUNNEL_URL\"}" || true
          fi

          # Function to trigger next workflow run before timeout
          schedule_next_run() {
            echo "Scheduling next 24/7 continuous runner cycle..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-server.yml/dispatches \
              -d '{"ref":"main"}' || true
          }

          # Run for up to 5 hours 30 mins (19800 seconds), then seamlessly auto-relaunch
          RUN_DURATION=19800
          START_TIME=$(date +%s)

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            
            if [ $ELAPSED -ge $RUN_DURATION ]; then
              echo "5.5 hours elapsed. Auto-dispatching next continuous cycle..."
              schedule_next_run
              sleep 10
              break
            fi

            # Check if server process is still alive
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process crashed, restarting main.py..."
              python -u main.py >> server.log 2>&1 &
              SERVER_PID=$!
            fi

            sleep 60
          done
